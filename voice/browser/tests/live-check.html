<!doctype html><meta charset="utf-8"><title>Local Voice · local integration check</title>
<style>body{font:18px system-ui;max-width:760px;margin:90px auto;background:#f4f6f8;color:#17232e}section{background:white;padding:24px;margin:20px 0;border-radius:16px}input,textarea{font:inherit;padding:12px;width:90%}output{display:block;margin-top:18px}small{color:#546575}</style>
<h1>Local Voice integration check</h1><p>This page stays on this Mac. Nothing is posted or sent to another website.</p>
<section><label for="search">Search</label><p><input id="search" type="search" aria-label="Search" autocomplete="off"></p><output id="result">Waiting for a search</output></section>
<section><label for="message">Message</label><p><textarea id="message" aria-label="Message" rows="2"></textarea></p><output id="draft">Waiting for typing</output></section>
<small id="evidence">No Enter received.</small>
<script>
window.checkState={searches:[],draft:'',trustedEnter:false};
const search=document.querySelector('#search');
search.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();checkState.trustedEnter=event.isTrusted;checkState.searches.push(search.value);document.querySelector('#result').textContent='Search received: '+search.value;document.querySelector('#evidence').textContent='Enter trusted: '+event.isTrusted+' · submissions: '+checkState.searches.length;}});
document.querySelector('#message').addEventListener('input',event=>{checkState.draft=event.target.value;document.querySelector('#draft').textContent='Draft received: '+event.target.value;});
</script>
